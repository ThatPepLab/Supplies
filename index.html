<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Peptide Supply List</title>
  <meta name="description" content="Peptide supply list with direct Amazon affiliate links." />
  <style>
    :root{--bg:#0b0f14;--panel:#111821;--panel2:#17212c;--text:#f5f7fa;--muted:#9ca9b6;--line:#273443;--accent:#ff9900;--accent2:#ffb84d;--shadow:0 14px 40px rgba(0,0,0,.28)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#080b10 0%,var(--bg) 100%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{width:min(1180px,92vw);margin:auto}header{padding:52px 0 28px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}h1{margin:.25rem 0 .6rem;font-size:clamp(2.3rem,5vw,4.4rem);line-height:1}.sub{color:var(--muted);max-width:760px;font-size:1.05rem}.notice{margin:20px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);color:#c9d2dc;font-size:.92rem}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:13px 15px;border-radius:12px;outline:none}input:focus{border-color:#667789}.category{margin:0 0 28px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:22px;padding:18px}.category h2{margin:0 0 4px;font-size:1.45rem}.category-desc{color:var(--muted);font-size:.92rem;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:195px}.card h3{font-size:1.08rem;margin:0 0 8px;line-height:1.25}.card p{color:var(--muted);margin:0 0 18px;font-size:.91rem}.btn{margin-top:auto;background:var(--accent);color:#161616;font-weight:800;padding:11px 14px;border-radius:11px;text-decoration:none;text-align:center}.btn:hover{background:var(--accent2)}.empty{border:1px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--muted);margin-bottom:30px}footer{border-top:1px solid var(--line);color:var(--muted);padding:24px 0 36px;font-size:.86rem}
  </style>
</head>
<body><div class="wrap"><header><div class="eyebrow">Recommended Supplies</div><h1>Peptide Supply List</h1><div class="sub">Common supplies grouped by how they are used.</div><div class="notice"><strong>Affiliate disclosure:</strong> As an Amazon Associate I earn from qualifying purchases.</div></header><main><div class="toolbar"><input id="search" type="search" placeholder="Search products…" aria-label="Search products" /></div><div id="categories"></div></main><footer>Product availability and pricing can change on Amazon. This site is independently maintained and is not Amazon.com.</footer></div>
<script>
const products=[
{category:'Miscellaneous',name:'Reusable Travel Ice',note:'Reusable cold-pack option for travel.',url:'https://amzn.to/45WELGJ'},
{category:'Miscellaneous',name:'Travel Pouch',note:'Compact pouch for keeping travel supplies organized.',url:'https://amzn.to/4g5dgiW'},
{category:'Nasal',name:'Saline Solution (Nasal Spray)',note:'Saline solution for nasal spray use.',url:'https://amzn.to/4wsxyJw'},
{category:'Pen Needle Injection',name:'Injector Pen Storage',note:'Storage case for injector pens and accessories.',url:'https://amzn.to/4zf9Cfc'},
{category:'Nasal',name:'Nasal Spray Vial',note:'Refillable nasal spray vial.',url:'https://amzn.to/45jHPMZ'},
{category:'Miscellaneous',name:'Clear Protein',note:'Clear protein drink option.',url:'https://amzn.to/45Xhp3K'},
{category:'Prep',name:'Label Maker (Niimbot M2)',note:'Niimbot M2 label maker.',url:'https://amzn.to/4xxgiU5'},
{category:'Prep',name:'Labels for M2',note:'Compatible labels for the Niimbot M2.',url:'https://amzn.to/4zgqH8t'},
{category:'Pen Needle Injection',name:'3ml Cartridges (For Injector Pens)',note:'3 mL cartridges for compatible injector pens.',url:'https://amzn.to/4hvkOxV'},
{category:'Pen Needle Injection',name:'Injector Pen',note:'Reusable injector pen.',url:'https://amzn.to/4cw3rcH'},
{category:'Traditional Injection',name:'Sharps Container',note:'Container for safe sharps disposal.',url:'https://amzn.to/4i3H8yG'},
{category:'Traditional Injection',name:'31ga 6mm',note:'31 gauge, 6 mm needles.',url:'https://amzn.to/4fSl9tg'},
{category:'Prep',name:'Alcohol Wipes',note:'Individually packaged alcohol prep wipes.',url:'https://amzn.to/3U9ZVhV'},
{category:'Pen Needle Injection',name:'32ga 6mm Pen Needles (Injector Pen ONLY)',note:'32 gauge, 6 mm pen needles for injector pen use only.',url:'https://amzn.to/4guwvDO'}];
const categoryOrder=['Nasal','Traditional Injection','Pen Needle Injection','Prep','Miscellaneous'];
const categoryDescriptions={'Nasal':'Supplies for nasal spray preparation and use.','Traditional Injection':'Supplies used with traditional syringe-based injections.','Pen Needle Injection':'Injector pens, cartridges, storage, and compatible pen needles.','Prep':'Preparation, labeling, and cleaning supplies.','Miscellaneous':'Travel, nutrition, and other useful supplies.'};
const categories=document.getElementById('categories'),search=document.getElementById('search');
function cardMarkup(p){return `<article class="card"><h3>${p.name}</h3><p>${p.note}</p><a class="btn" href="${p.url}" target="_blank" rel="sponsored noopener">View on Amazon</a></article>`}
function renderProducts(filter=''){const q=filter.trim().toLowerCase();let html='',total=0;categoryOrder.forEach(cat=>{const matches=products.filter(p=>p.category===cat&&(p.name+' '+p.note+' '+p.category).toLowerCase().includes(q));if(!matches.length)return;total+=matches.length;html+=`<section class="category"><h2>${cat}</h2><div class="category-desc">${categoryDescriptions[cat]}</div><div class="grid">${matches.map(cardMarkup).join('')}</div></section>`});categories.innerHTML=total?html:'<div class="empty">No products match that search.</div>'}
search.addEventListener('input',e=>renderProducts(e.target.value));renderProducts();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Peptide Supply List</title><meta name="description" content="Peptide supply list with direct Amazon affiliate links."/><style>
:root{--bg:#0b0f14;--panel:#111821;--panel2:#17212c;--text:#f5f7fa;--muted:#9ca9b6;--line:#273443;--accent:#ff9900;--accent2:#ffb84d;--shadow:0 10px 28px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b10,var(--bg));color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{width:min(1240px,94vw);margin:auto}header{padding:42px 0 22px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.76rem}h1{margin:.25rem 0 .5rem;font-size:clamp(2.2rem,5vw,4rem);line-height:1}.sub{color:var(--muted);max-width:760px}.notice{margin:16px 0 0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);color:#c9d2dc;font-size:.88rem}.toolbar{margin:20px 0}input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px 14px;border-radius:11px;outline:none}.categories-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.category{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:18px;padding:14px}.category h2{margin:0 0 2px;font-size:1.28rem}.category-desc{color:var(--muted);font-size:.84rem;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:155px}.card h3{font-size:.98rem;margin:0 0 5px;line-height:1.2}.card p{color:var(--muted);margin:0 0 12px;font-size:.82rem;line-height:1.35}.btn{margin-top:auto;background:var(--accent);color:#161616;font-weight:800;padding:9px 10px;border-radius:9px;text-decoration:none;text-align:center;font-size:.86rem}.btn:hover{background:var(--accent2)}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);color:var(--muted);padding:22px 0 32px;margin-top:30px;font-size:.84rem}@media(max-width:800px){.categories-grid{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="eyebrow">Recommended Supplies</div><h1>Peptide Supply List</h1><div class="sub">Common supplies grouped by how they are used.</div><div class="notice"><strong>Affiliate disclosure:</strong> As an Amazon Associate I earn from qualifying purchases.</div></header><main><div class="toolbar"><input id="search" type="search" placeholder="Search products…" aria-label="Search products"/></div><div id="categories" class="categories-grid"></div></main><footer>Product availability and pricing can change on Amazon. This site is independently maintained and is not Amazon.com.</footer></div><script>
const products=[{category:'Miscellaneous',name:'Reusable Travel Ice',note:'Reusable cold-pack option for travel.',url:'https://amzn.to/45WELGJ'},{category:'Miscellaneous',name:'Travel Pouch',note:'Compact pouch for keeping travel supplies organized.',url:'https://amzn.to/4g5dgiW'},{category:'Nasal',name:'Saline Solution (Nasal Spray)',note:'Saline solution for nasal spray use.',url:'https://amzn.to/4wsxyJw'},{category:'Pen Needle Injection',name:'Injector Pen Storage',note:'Storage case for injector pens and accessories.',url:'https://amzn.to/4zf9Cfc'},{category:'Nasal',name:'Nasal Spray Vial',note:'Refillable nasal spray vial.',url:'https://amzn.to/45jHPMZ'},{category:'Miscellaneous',name:'Clear Protein',note:'Clear protein drink option.',url:'https://amzn.to/45Xhp3K'},{category:'Miscellaneous',name:'Label Maker (Niimbot M2)',note:'Niimbot M2 label maker.',url:'https://amzn.to/4xxgiU5'},{category:'Miscellaneous',name:'Labels for M2',note:'Compatible labels for the Niimbot M2.',url:'https://amzn.to/4zgqH8t'},{category:'Pen Needle Injection',name:'3ml Cartridges (For Injector Pens)',note:'3 mL cartridges for compatible injector pens.',url:'https://amzn.to/4hvkOxV'},{category:'Pen Needle Injection',name:'Injector Pen',note:'Reusable injector pen.',url:'https://amzn.to/4cw3rcH'},{category:'Prep',name:'Sharps Container',note:'Container for safe sharps disposal.',url:'https://amzn.to/4i3H8yG'},{category:'Traditional Injection',name:'Insulin Needle (31ga 6mm)',note:'31 gauge, 6 mm needles.',url:'https://amzn.to/4fSl9tg'},{category:'Prep',name:'Alcohol Wipes',note:'Individually packaged alcohol prep wipes.',url:'https://amzn.to/3U9ZVhV'},{category:'Pen Needle Injection',name:'32ga 6mm Pen Needles (Injector Pen ONLY)',note:'32 gauge, 6 mm pen needles for injector pen use only.',url:'https://amzn.to/4guwvDO'}];
const categoryOrder=['Traditional Injection','Prep','Pen Needle Injection','Nasal','Miscellaneous'];const categoryDescriptions={'Nasal':'Supplies for nasal spray preparation and use.','Traditional Injection':'Supplies used with traditional syringe-based injections.','Pen Needle Injection':'Injector pens, cartridges, storage, and compatible pen needles.','Prep':'Preparation, cleaning, and disposal supplies.','Miscellaneous':'Travel, nutrition, labeling, and other useful supplies.'};const categories=document.getElementById('categories'),search=document.getElementById('search');function cardMarkup(p){return `<article class="card"><h3>${p.name}</h3><p>${p.note}</p><a class="btn" href="${p.url}" target="_blank" rel="sponsored noopener">View on Amazon</a></article>`}function renderProducts(filter=''){const q=filter.trim().toLowerCase();let html='',total=0;categoryOrder.forEach(cat=>{const matches=products.filter(p=>p.category===cat&&(p.name+' '+p.note+' '+p.category).toLowerCase().includes(q));if(!matches.length)return;total+=matches.length;html+=`<section class="category"><h2>${cat}</h2><div class="category-desc">${categoryDescriptions[cat]}</div><div class="grid">${matches.map(cardMarkup).join('')}</div></section>`});categories.innerHTML=total?html:'<div class="empty">No products match that search.</div>'}search.addEventListener('input',e=>renderProducts(e.target.value));renderProducts();
</script></body></html>
